<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Thank You | Brandi Made</title>
<meta name="description" content="Thanks for your response. Brandi Made will get back to you within 24 business hours.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://brandimade.com.au/thank-you.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #152228;
    --mid: #4e8098;
    --light: #bbd2e4;
    --red: #a31621;
    --offwhite: #f5f2ee;
    --white: #ffffff;
    --text-dark: #1a2d35;
    --text-mid: #4a5e66;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    color: var(--text-dark);
    background: var(--offwhite);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  nav {
    background: var(--dark);
    padding: 18px 40px;
    display: flex;
    align-items: center;
  }
  nav img { height: 36px; }
  .page {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 24px;
  }
  .card {
    background: var(--white);
    border-radius: 12px;
    padding: 64px 56px;
    max-width: 560px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 32px rgba(21,34,40,0.08);
  }
  .icon {
    width: 64px;
    height: 64px;
    background: #e8f4f0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 28px;
  }
  .icon svg { width: 30px; height: 30px; stroke: #2a7a5e; }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--dark);
    margin-bottom: 16px;
  }
  p {
    font-size: 1rem;
    color: var(--text-mid);
    line-height: 1.7;
    margin-bottom: 12px;
  }
  .divider {
    width: 48px;
    height: 3px;
    background: var(--mid);
    margin: 28px auto;
    border-radius: 2px;
  }
  .btn {
    display: inline-block;
    margin-top: 16px;
    padding: 14px 32px;
    background: var(--dark);
    color: var(--white);
    text-decoration: none;
    border-radius: 4px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--mid); }
  footer {
    background: var(--dark);
    color: var(--light);
    text-align: center;
    padding: 20px;
    font-size: 0.8rem;
  }


  @media (max-width: 480px) {
    .card { padding: 40px 24px; }
    h1 { font-size: 1.6rem; }
    nav { padding: 16px 5%; }
  }

</style>
</head>
<body>

<nav>
  <a href="index.html">
    <img src="https://images.squarespace-cdn.com/content/v1/6876314015f2f552f09dcf7e/cba38361-3b90-4ece-a3af-92b988dbea65/Screenshot_2025-10-19_at_8.58.09_am-removebg-preview.png?format=1500w" alt="Brandi Made">
  </a>
</nav>

<main class="page">
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>Thank you.</h1>
    <div class="divider"></div>
    <p>Thanks for your response — we'll get back to you within 24 business hours.</p>
    <p>In the meantime, feel free to browse our product range or get in touch directly.</p>
    <a href="index.html" class="btn">Back to Home</a>
  </div>
</main>

<footer>
  <p>© 2026 Brandi Made. All rights reserved. Australia.</p>
</footer>



</body>
</html>
